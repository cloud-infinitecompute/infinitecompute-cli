name: Secret scan (gitleaks)

# Scans only the commits a PR (or a push to main) adds, so secrets already in
# history don't fail every PR. Known historical findings are also listed in
# .gitleaksignore so a full-history run (workflow_dispatch) is green; those
# are reviewed false positives. Config: .gitleaks.toml. INF-352.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  # sha256 of gitleaks_8.30.1_linux_x64.tar.gz (release checksums file and the
  # GitHub release asset digest agree). Bump both together.
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (checksum-verified)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan new commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)
              base="$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA")"
              range="${base}..${PR_HEAD_SHA}" ;;
            push)
              if [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
                range="$PUSH_AFTER"
              else
                range="${PUSH_BEFORE}..${PUSH_AFTER}"
              fi ;;
            *)
              range="" ;; # workflow_dispatch: full history, .gitleaksignore applies
          esac
          args=(git --redact --no-banner --verbose)
          if [ -n "$range" ]; then args+=(--log-opts="$range"); fi
          echo "Scanning: ${range:-full history}"
          # --redact keeps any match out of the job log.
          "$RUNNER_TEMP/gitleaks" "${args[@]}" .
